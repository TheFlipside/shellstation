name: Release

# The actions used here are named by commit, with the release that commit
# is in a comment. A tag such as v4 can be moved to other code by whoever
# controls the action's repository, and these jobs hold the key the updates
# are signed with and the tokens the releases are published with.
# docs/DEVELOPMENT.md (Updating Dependencies) has how to move to a newer one.
#
# No checkout leaves its token in the repository's git config
# (persist-credentials: false): nothing here uses git after the checkout,
# and what a job runs afterwards, npm ci and the build scripts among it,
# could read it there. Whether the runner hands the same token to the
# steps in their environment as well is the runner's doing, not this file's.
#
# The cache of downloaded crates is restored for exactly the Cargo.lock
# of the commit being built, and for no other (no restore-keys): what is
# restored is built into an app that is then signed, and cargo does not
# check a crate that is already there against the lock file again.
# The runners run on their hosts, so ~/.cargo is there from earlier
# jobs in any case; see Known issues in CHANGELOG.md.

on:
  push:
    tags:
      - "v*"

jobs:
  preflight:
    runs-on: linux
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Reject placeholder updater pubkey
        # Releases shipped with the placeholder pubkey embedded will fail
        # signature verification on every future update, with a misleading
        # error in the UI. Block the release outright until it's replaced.
        run: |
          set -euo pipefail
          if grep -q 'REPLACE_WITH_BASE64_PUBLIC_KEY' src-tauri/tauri.conf.json; then
            echo "::error::tauri.conf.json still has the placeholder updater pubkey. Replace it with the real key before tagging a release. See docs/RELEASING.md." >&2
            exit 1
          fi

      - name: Reject a tag that is not the app's version
        # The build signs each updater artifact for the version in
        # tauri.conf.json, and the manifest announces the version of the
        # tag. The app refuses an update whose two versions differ
        # (requireSignedVersion), so a release tagged without the version
        # bump would publish normally and be one no installed app updates
        # to. A throwaway tag pushed to try the pipeline ends in "-test",
        # or in "-test" and a number (docs/DEVELOPMENT.md), and is let
        # through: no app takes its release either, and it is deleted
        # again.
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n 's/^  "version": "\([^"]*\)".*$/\1/p' src-tauri/tauri.conf.json)"
          # One version, and nothing else: what is read here is printed below.
          if ! [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Could not read the version from src-tauri/tauri.conf.json." >&2
            exit 1
          fi
          if [[ "$tag_version" =~ -test[0-9]*$ ]]; then
            echo "Throwaway tag: not compared with the app's version ${app_version}. No installed app will take this release as an update."
            exit 0
          fi
          if [ "$tag_version" != "$app_version" ]; then
            echo "::error::The tag is for version ${tag_version}, but src-tauri/tauri.conf.json has ${app_version}. No installed app would update to this release. Bump the version first, see docs/RELEASING.md." >&2
            exit 1
          fi

  build-linux:
    needs: preflight
    runs-on: linux
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify toolchain
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Cache cargo registry
        uses: https://github.com/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles deb,appimage

      - name: Collect artifacts
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist-release
          for f in src-tauri/target/release/bundle/deb/*.deb; do
            [ -f "$f" ] || continue
            cp "$f" "dist-release/ShellStation-linux-amd64-${version}.deb"
          done
          for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
            [ -f "$f" ] || continue
            cp "$f" "dist-release/ShellStation-linux-amd64-${version}.AppImage"
          done
          # Updater artifacts (created when TAURI_SIGNING_PRIVATE_KEY is set
          # and tauri.conf.json has bundle.createUpdaterArtifacts=true). The
          # AppImage itself is what gets installed; the .sig is consumed by
          # the updater plugin to verify the download.
          for f in src-tauri/target/release/bundle/appimage/*.AppImage.sig; do
            [ -f "$f" ] || continue
            cp "$f" "dist-release/ShellStation-linux-amd64-${version}.AppImage.sig"
          done
          ls -la dist-release/

      - name: Upload artifacts
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: linux-bundles
          path: dist-release/*

  build-windows:
    needs: preflight
    runs-on: windows
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify toolchain
        shell: powershell
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          rustup target add x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: https://github.com/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles msi,nsis

      - name: Collect artifacts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null

          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName "dist-release/ShellStation-windows-x64-$version.msi"
          }

          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName "dist-release/ShellStation-windows-x64-$version-setup.exe"
          }

          # Updater artifact + signature. The NSIS .exe IS the updater
          # artifact on Windows (no separate .zip is produced for NSIS); the
          # plugin downloads it, verifies the .sig, and runs it in
          # `installMode: passive`.
          $sig = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe.sig -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sig) {
            Copy-Item $sig.FullName "dist-release/ShellStation-windows-x64-$version-setup.exe.sig"
          }

          $raw = "src-tauri/target/release/shellstation.exe"
          if (Test-Path $raw) {
            $stage = New-Item -ItemType Directory -Force -Path "dist-release/zip-stage"
            Copy-Item $raw (Join-Path $stage.FullName "ShellStation.exe")
            Compress-Archive -Path (Join-Path $stage.FullName "ShellStation.exe") `
              -DestinationPath "dist-release/ShellStation-windows-x64-$version.zip" -Force
            Remove-Item -Recurse -Force $stage.FullName
          }

          Get-ChildItem dist-release

      - name: Upload artifacts
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: windows-bundles
          path: dist-release/*

  build-macos-x64:
    needs: preflight
    runs-on: macos
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify toolchain
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          rustup target add x86_64-apple-darwin

      - name: Cache cargo registry
        uses: https://github.com/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-x64-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (x64)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # `app` bundle is needed so tauri can produce the `.app.tar.gz`
        # updater artifact alongside the .dmg first-install artifact.
        run: npm run tauri build -- --target x86_64-apple-darwin --bundles dmg,app

      - name: Collect artifacts
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist-release
          for f in src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg; do
            [ -f "$f" ] || continue
            cp "$f" "dist-release/ShellStation-macos-x64-${version}.dmg"
          done
          for f in src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz; do
            [ -f "$f" ] || continue
            cp "$f" "dist-release/ShellStation-macos-x64-${version}.app.tar.gz"
          done
          for f in src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig; do
            [ -f "$f" ] || continue
            cp "$f" "dist-release/ShellStation-macos-x64-${version}.app.tar.gz.sig"
          done
          ls -la dist-release/

      - name: Upload artifacts
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: macos-x64-bundles
          path: dist-release/*

  build-macos-arm64:
    needs: preflight
    runs-on: macos
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify toolchain
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          rustup target add aarch64-apple-darwin

      - name: Cache cargo registry
        uses: https://github.com/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-arm64-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (arm64)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles dmg,app

      - name: Collect artifacts
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist-release
          for f in src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg; do
            [ -f "$f" ] || continue
            cp "$f" "dist-release/ShellStation-macos-arm64-${version}.dmg"
          done
          for f in src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz; do
            [ -f "$f" ] || continue
            cp "$f" "dist-release/ShellStation-macos-arm64-${version}.app.tar.gz"
          done
          for f in src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig; do
            [ -f "$f" ] || continue
            cp "$f" "dist-release/ShellStation-macos-arm64-${version}.app.tar.gz.sig"
          done
          ls -la dist-release/

      - name: Upload artifacts
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: macos-arm64-bundles
          path: dist-release/*

  build-extras:
    needs: preflight
    runs-on: linux
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Package extras
        run: |
          set -euo pipefail
          mkdir -p dist-release extras-stage/tools
          cp tools/generate_test_data.py extras-stage/tools/
          cp -r tools/highlight_profiles extras-stage/tools/
          (cd extras-stage && zip -r ../dist-release/extras.zip tools)
          ls -la dist-release/

      - name: Upload artifacts
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: extras-bundle
          path: dist-release/*

  publish-release:
    needs: [build-linux, build-windows, build-macos-x64, build-macos-arm64, build-extras]
    runs-on: linux
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download Linux artifacts
        uses: https://github.com/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          name: linux-bundles
          path: release-files

      - name: Download Windows artifacts
        uses: https://github.com/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          name: windows-bundles
          path: release-files

      - name: Download macOS x64 artifacts
        uses: https://github.com/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          name: macos-x64-bundles
          path: release-files

      - name: Download macOS arm64 artifacts
        uses: https://github.com/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          name: macos-arm64-bundles
          path: release-files

      - name: Download extras artifact
        uses: https://github.com/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          name: extras-bundle
          path: release-files

      - name: List release files
        run: ls -la release-files/

      - name: Generate latest.json (updater manifest)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          export RELEASE_VERSION="$version"
          export RELEASE_TAG="$TAG"
          # Generate via Python so signature file contents (which may contain
          # newlines from the minisign header) are JSON-encoded safely
          # instead of round-tripping through bash variable expansion.
          python3 .forgejo/scripts/generate_latest_json.py
          # Echo the platform keys but NOT the full signature bodies —
          # signatures are public once released but logging them on every
          # run is unnecessary disclosure.
          python3 -c 'import json; m = json.load(open("release-files/latest.json")); print("version:", m["version"]); print("platforms:", list(m["platforms"].keys()))'
          platform_count=$(python3 -c 'import json; print(len(json.load(open("release-files/latest.json"))["platforms"]))')
          if [ "$platform_count" = "0" ]; then
            echo "::warning::latest.json has no platforms — TAURI_SIGNING_PRIVATE_KEY secret likely missing; updater will not detect this release."
          fi

      - name: Publish Forgejo release
        env:
          FORGEJO_URL: https://git.fiedler.live
          REPO: tux/shellstation
          TAG: ${{ github.ref_name }}
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          api="$FORGEJO_URL/api/v1/repos/$REPO"

          # What this step keeps on disk goes into a directory of its own,
          # which only this user can enter and which is removed when the
          # step ends: the server's answers, and the token. curl reads the
          # token from a file there, so that it is not among the arguments
          # of each curl, which other users of the runner can read. curl
          # reads a header from a file since 7.55.
          umask 077
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          printf 'Authorization: token %s\n' "$TOKEN" > "$tmp/auth"
          auth="@$tmp/auth"

          # Helper: perform an API call and capture status + body separately
          # so failures can be diagnosed instead of silently swallowed.
          api_call() {
            local method="$1"
            local url="$2"
            shift 2
            local body_file status
            body_file=$(mktemp "$tmp/answer.XXXXXX")
            status=$(curl -sS -o "$body_file" -w '%{http_code}' \
              -X "$method" -H "$auth" "$@" "$url")
            printf '%s\n' "$status"
            cat "$body_file"
            rm -f "$body_file"
          }

          # The tag and the names of the files go into URLs and into a JSON
          # body. Both are only ever what a maintainer pushed and what the
          # build named, but neither is taken for safe to paste in: a quote
          # in a tag would end the JSON string, and an "&" or "#" would end
          # the value in a URL. A "/" in a tag is encoded as well; no tag
          # that is the app's version has one. python3 runs with -I, so
          # that it loads nothing from the checkout it is started in.
          urlencode() {
            python3 -I -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"
          }

          # Look up existing release by tag. 404 is expected on first run.
          tag_in_url=$(urlencode "$TAG")
          lookup=$(api_call GET "$api/releases/tags/$tag_in_url")
          lookup_status=$(printf '%s' "$lookup" | head -n1)
          lookup_body=$(printf '%s' "$lookup" | tail -n +2)

          # Extract the FIRST "id":N from a JSON body. The release's own id
          # is always the first id field; nested objects (author, etc.) come
          # later, so a greedy match would return the wrong one.
          first_id() {
            grep -o '"id"[[:space:]]*:[[:space:]]*[0-9]*' | \
              head -n1 | grep -o '[0-9]*$'
          }

          if [ "$lookup_status" = "200" ]; then
            release_id=$(printf '%s' "$lookup_body" | first_id)
            echo "Reusing existing release $TAG (id=$release_id)"
          elif [ "$lookup_status" = "404" ]; then
            echo "Creating release $TAG"
            payload=$(python3 -I -c 'import json, sys; print(json.dumps({"tag_name": sys.argv[1], "name": sys.argv[1]}))' "$TAG")
            create=$(api_call POST "$api/releases" \
              -H "Content-Type: application/json" \
              --data-raw "$payload")
            create_status=$(printf '%s' "$create" | head -n1)
            create_body=$(printf '%s' "$create" | tail -n +2)
            if [ "$create_status" != "201" ]; then
              echo "Release creation failed: HTTP $create_status" >&2
              echo "$create_body" >&2
              exit 1
            fi
            release_id=$(printf '%s' "$create_body" | first_id)
          else
            echo "Release lookup failed: HTTP $lookup_status" >&2
            echo "$lookup_body" >&2
            exit 1
          fi

          if [ -z "${release_id:-}" ]; then
            echo "Failed to obtain release id" >&2
            exit 1
          fi

          # Fetch existing assets so we can overwrite.
          assets=$(api_call GET "$api/releases/$release_id/assets")
          assets_status=$(printf '%s' "$assets" | head -n1)
          assets_json=$(printf '%s' "$assets" | tail -n +2)
          if [ "$assets_status" != "200" ]; then
            echo "Asset listing failed: HTTP $assets_status" >&2
            echo "$assets_json" >&2
            exit 1
          fi

          for f in release-files/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            name_in_url=$(urlencode "$name")
            # Split assets_json into one object per line, then find the line
            # with matching name and extract its id. Works on compact JSON.
            existing_id=$(printf '%s' "$assets_json" | \
              tr '}' '\n' | \
              grep -F "\"name\":\"$name\"" | \
              grep -o '"id"[[:space:]]*:[[:space:]]*[0-9]*' | \
              head -n1 | grep -o '[0-9]*$' || true)
            if [ -n "${existing_id:-}" ]; then
              echo "Deleting existing asset $name (id=$existing_id)"
              curl -fsSL -X DELETE -H "$auth" \
                "$api/releases/$release_id/assets/$existing_id"
            fi
            echo "Uploading $name"
            # In the file name of a form field, curl reads ";" and "," as
            # its own syntax unless the name is in double quotes, where a
            # quote and a backslash have a backslash before them. The
            # server's answer is kept for the error message, in this
            # step's own directory and not at a fixed name in /tmp, where
            # someone else on the runner could have put a link.
            # The two characters are in variables, which reads plainer than
            # the same substitutions with each of them escaped in place.
            backslash='\'
            quote='"'
            f_quoted=${f//"$backslash"/"$backslash$backslash"}
            f_quoted=${f_quoted//"$quote"/"$backslash$quote"}
            upload=$(curl -sS -o "$tmp/upload" -w '%{http_code}' \
              -X POST -H "$auth" \
              -F "attachment=@\"$f_quoted\"" \
              "$api/releases/$release_id/assets?name=$name_in_url")
            if [ "$upload" != "201" ]; then
              echo "Upload of $name failed: HTTP $upload" >&2
              cat "$tmp/upload" >&2
              exit 1
            fi
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GH_REPO: TheFlipside/shellstation
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; uploading assets with --clobber"
            gh release upload "$TAG" release-files/* --clobber
          else
            echo "Creating GitHub release $TAG"
            gh release create "$TAG" \
              --title "ShellStation $TAG" \
              --generate-notes \
              release-files/*
          fi
